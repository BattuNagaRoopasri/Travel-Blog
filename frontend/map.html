<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Travel Map</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map-container {
            width: 90%;
            height: 70vh;
            margin: 2rem auto;
            max-width: 1200px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 5px solid white;
            transition: all 0.3s ease;
        }
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .map-header {
            text-align: center;
            padding: 3rem 1rem 1rem 1rem;
        }
        .map-header h2 {
            font-size: 2.5rem;
            color: #222;
        }
        .map-header p {
            color: #666;
            font-size: 1.1rem;
            margin-top: 10px;
        }
        
        
        
        /* Nav style override for minimal header */
        .minimal-header {
            min-height: 10vh !important;
            padding-top: 2rem !important;
            background: #222 !important;
        }
    </style>
</head>
<body>
    <header class="flex minimal-header">
        <div class="container">
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="destinations.html">Destinations</a></li>
                    <li><a href="map.html">Map</a></li>
                    <li><a href="travel stories.html">Travel Stories</a></li>
                    <li><a href="tips.html">Travel Tips</a></li>
                    <li><a href="gallery page.html">Gallery</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="About.html">About Me</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="map-header">
        <h2>Explore Our Destinations 🌍</h2>
        <p>Click on any red marker on the map to see details about the location.</p>
    </div>

    <div id="map-container">
        <div id="map"></div>
    </div>

    <footer style="margin-top: 4rem;">
        <p>&copy; 2024 Travel Blog. All rights reserved.</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize the map, setting the default view (Lat, Lng) and zoom level
        const map = L.map('map').setView([20.0, 0.0], 2);

        // Load the beautiful map tiles from OpenStreetMap
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Fetch World GeoJSON to make EVERY country clickable
        fetch('https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        color: '#3498db',
                        weight: 1,
                        fillColor: '#3498db',
                        fillOpacity: 0.1
                    },
                    onEachFeature: function (feature, layer) {
                        layer.on('click', function (e) {
                            const countryName = feature.properties.name;
                            
                            // Show a loading popup immediately
                            const popup = L.popup()
                                .setLatLng(e.latlng)
                                .setContent(`<div style="text-align:center;"><b>${countryName}</b><br>Loading amazing places... ⏳</div>`)
                                .openOn(map);

                            // Fetch country image and info from Wikipedia API
                            fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(countryName)}`)
                                .then(response => response.json())
                                .then(wikiData => {
                                    let imgHtml = '';
                                    if (wikiData.thumbnail && wikiData.thumbnail.source) {
                                        imgHtml = `<img src="${wikiData.thumbnail.source}" alt="${countryName}" style="width: 100%; max-height: 140px; object-fit: cover; border-radius: 8px; margin: 10px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">`;
                                    } else {
                                        imgHtml = `<div style="height:10px;"></div>`;
                                    }
                                    
                                    // Custom famous places for top countries, else use wikipedia summary
                                    const customPlaces = getFamousPlaces(countryName);
                                    let descHtml = customPlaces ? customPlaces : (wikiData.extract ? wikiData.extract.substring(0, 120) + '...' : 'Discover beautiful destinations here.');
                                    
                                    popup.setContent(`
                                        <div style="text-align:center; max-width: 250px; font-family: 'Open Sans', sans-serif;">
                                            <b style="font-size:1.3rem; color:#222; font-family:'Raleway', sans-serif;">${countryName}</b>
                                            ${imgHtml}
                                            <p style="color:#555; font-size:0.95rem; line-height:1.4; margin-bottom:10px;">${descHtml}</p>
                                            <a href="https://en.wikipedia.org/wiki/${encodeURIComponent(countryName)}" target="_blank" style="color: #3498db; font-size: 0.85rem; font-weight:bold; text-decoration:none;">Read more on Wikipedia &rarr;</a>
                                        </div>
                                    `);
                                })
                                .catch(err => {
                                    popup.setContent(`<b>${countryName}</b><br>Explore beautiful places here!`);
                                });
                        });
                        
                        // Hover effect for countries
                        layer.on('mouseover', function () {
                            this.setStyle({ fillOpacity: 0.5, color: '#e74c3c', weight: 2 });
                        });
                        layer.on('mouseout', function () {
                            this.setStyle({ fillOpacity: 0.1, color: '#3498db', weight: 1 });
                        });
                    }
                }).addTo(map);
            });

        // Dictionary of famous places for popular countries
        function getFamousPlaces(country) {
            const places = {
                "India": "<b>Famous Places:</b> Taj Mahal (Agra), Jaipur, Kerala Backwaters, Varanasi, Goa Beaches.",
                "France": "<b>Famous Places:</b> Eiffel Tower, The Louvre, Mont Saint-Michel, French Riviera.",
                "United States of America": "<b>Famous Places:</b> Grand Canyon, Statue of Liberty, Yellowstone, Times Square.",
                "Japan": "<b>Famous Places:</b> Mount Fuji, Kyoto Temples, Tokyo Tower, Osaka Castle.",
                "Italy": "<b>Famous Places:</b> Colosseum, Venice Canals, Leaning Tower of Pisa, Amalfi Coast.",
                "Australia": "<b>Famous Places:</b> Sydney Opera House, Great Barrier Reef, Uluru, Gold Coast.",
                "Brazil": "<b>Famous Places:</b> Christ the Redeemer, Copacabana, Iguazu Falls, Amazon Rainforest.",
                "China": "<b>Famous Places:</b> Great Wall of China, Forbidden City, Terracotta Army.",
                "Egypt": "<b>Famous Places:</b> Pyramids of Giza, Sphinx, Valley of the Kings, Nile River.",
                "United Kingdom": "<b>Famous Places:</b> Big Ben, Stonehenge, Tower of London, Edinburgh Castle.",
                "Spain": "<b>Famous Places:</b> La Sagrada Familia, Alhambra, Park Güell, Ibiza.",
                "Greece": "<b>Famous Places:</b> Acropolis of Athens, Santorini, Mykonos, Delphi.",
                "Thailand": "<b>Famous Places:</b> Grand Palace, Phi Phi Islands, Ayutthaya, Chiang Mai.",
                "Mexico": "<b>Famous Places:</b> Chichen Itza, Cancun Beaches, Teotihuacan, Tulum.",
                "Canada": "<b>Famous Places:</b> Niagara Falls, Banff National Park, CN Tower, Whistler."
            };
            return places[country] || null;
        }

        // Add custom markers for famous travel destinations
        const locations = [
            { name: "Paris, France", coords: [48.8566, 2.3522], desc: "The city of light, famous for the Eiffel Tower." },
            { name: "New York, USA", coords: [40.7128, -74.0060], desc: "The concrete jungle where dreams are made of." },
            { name: "Tokyo, Japan", coords: [35.6762, 139.6503], desc: "A bustling metropolis balancing tradition and future." },
            { name: "Bali, Indonesia", coords: [-8.4095, 115.1889], desc: "Tropical paradise with beaches and coral reefs." },
            { name: "Machu Picchu, Peru", coords: [-13.1631, -72.5450], desc: "Incan citadel set high in the Andes Mountains." },
            { name: "Sydney, Australia", coords: [-33.8688, 151.2093], desc: "Famous for its Opera House and beautiful harbour." },
            { name: "Cape Town, South Africa", coords: [-33.9249, 18.4241], desc: "Port city beneath the imposing Table Mountain." },
            { name: "Santorini, Greece", coords: [36.3932, 25.4615], desc: "Famous for its white houses and blue domes." },
            { name: "Taj Mahal, India", coords: [27.1751, 78.0421], desc: "Iconic ivory-white marble mausoleum in Agra." }
        ];

        // Loop through each location and put a marker on the map
        locations.forEach(loc => {
            const marker = L.marker(loc.coords).addTo(map);
            marker.bindPopup(`<b style="font-size:1.1rem; color:#222;">${loc.name}</b><br><span style="color:#666;">${loc.desc}</span>`);
        });
    </script>
    
</body>
</html>
